name: Scheduled Regression CI

on:
  schedule:
    # Run weekly on Sunday at 03:00 UTC to detect upstream toolchain drift and link degradation
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: scheduled-regression
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    name: Toolchain & Build Regression Verification
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Gradle Wrapper Integrity
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Cache Termux Bootstrap Archives
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/bootstrap-*.zip
          key: termux-bootstraps-${{ hashFiles('app/build.gradle') }}
          restore-keys: |
            termux-bootstraps-

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Download Termux Bootstraps
        run: ./gradlew downloadBootstraps

      - name: Compile Java & Native Components
        run: ./gradlew :app:compileDebugJavaWithJavac

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Validate Release Compilation
        run: ./gradlew assembleRelease

      - name: Verify Build Artifacts & Compute SHA-256
        run: |
          echo "### Scheduled Regression Verification Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact Type | File | Size | SHA-256 |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          
          DEBUG_APK=$(ls -1 app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -s "$DEBUG_APK" ]; then
            DEBUG_SIZE=$(stat -c%s "$DEBUG_APK" 2>/dev/null || stat -f%z "$DEBUG_APK")
            DEBUG_SHA=$(sha256sum "$DEBUG_APK" | cut -d ' ' -f 1)
            echo "| Debug APK | \`$(basename "$DEBUG_APK")\` | ${DEBUG_SIZE} bytes | \`${DEBUG_SHA}\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "Error: Debug APK not produced during regression check." >&2
            exit 1
          fi
          
          RELEASE_APK=$(ls -1 app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -s "$RELEASE_APK" ]; then
            RELEASE_SIZE=$(stat -c%s "$RELEASE_APK" 2>/dev/null || stat -f%z "$RELEASE_APK")
            RELEASE_SHA=$(sha256sum "$RELEASE_APK" | cut -d ' ' -f 1)
            echo "| Release APK | \`$(basename "$RELEASE_APK")\` | ${RELEASE_SIZE} bytes | \`${RELEASE_SHA}\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "Error: Release APK not produced during regression check." >&2
            exit 1
          fi

      - name: Upload Diagnostic Test Reports on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regression-failure-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          retention-days: 7
