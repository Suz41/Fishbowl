name: Build Bot

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build, Test & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Gradle Wrapper Integrity
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Termux Bootstrap Archives
        uses: actions/cache@v6
        id: cache-bootstraps
        with:
          path: app/src/main/cpp/bootstrap-*.zip
          key: termux-bootstraps-${{ hashFiles('app/build.gradle') }}
          restore-keys: |
            termux-bootstraps-

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Download Termux Bootstraps
        run: ./gradlew downloadBootstraps

      - name: Compile Java & Verify
        run: ./gradlew :app:compileDebugJavaWithJavac

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Validate Release Build Compilation
        run: ./gradlew assembleRelease

      - name: Verify Build Artifacts & Compute Checksums
        run: |
          echo "### CI Build Verification Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact Type | Path | Size | SHA-256 |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          
          DEBUG_APK=$(ls -1 app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -s "$DEBUG_APK" ]; then
            DEBUG_SIZE=$(stat -c%s "$DEBUG_APK" 2>/dev/null || stat -f%z "$DEBUG_APK")
            DEBUG_SHA=$(sha256sum "$DEBUG_APK" | cut -d ' ' -f 1)
            echo "| Debug APK | \`$(basename "$DEBUG_APK")\` | ${DEBUG_SIZE} bytes | \`${DEBUG_SHA}\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "Error: Debug APK was not generated or is empty!" >&2
            exit 1
          fi
          
          RELEASE_APK=$(ls -1 app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -s "$RELEASE_APK" ]; then
            RELEASE_SIZE=$(stat -c%s "$RELEASE_APK" 2>/dev/null || stat -f%z "$RELEASE_APK")
            RELEASE_SHA=$(sha256sum "$RELEASE_APK" | cut -d ' ' -f 1)
            echo "| Release Validation APK | \`$(basename "$RELEASE_APK")\` | ${RELEASE_SIZE} bytes | \`${RELEASE_SHA}\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "Error: Release validation APK was not generated or is empty!" >&2
            exit 1
          fi

      - name: Upload Unit Test Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Release Validation Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: release-validation-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 3
