name: CodeQL Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Security Scan (Java/Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Termux Bootstrap Archives
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/bootstrap-*.zip
          key: termux-bootstraps-${{ hashFiles('app/build.gradle') }}
          restore-keys: |
            termux-bootstraps-

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Download Termux Bootstraps
        run: ./gradlew downloadBootstraps

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-extended,security-and-quality

      - name: Build Java Sources for CodeQL Extraction
        run: ./gradlew :app:compileDebugJavaWithJavac

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
