name: Welcome Bot

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read

jobs:
  welcome:
    name: First Interaction Welcome
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write

    steps:
      - name: Welcome Contributor
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: |
            Thank you for opening your first pull request on Fishbowl.

            Please ensure that your code adheres to the project standards:
            - Pure Dark Mode styling only
            - Zero emojis across code, UI, and logs
            - Targeted surgical diffs without extraneous whitespace
            - Verification via `./gradlew compileDebugJavaWithJavac` and `./gradlew testDebugUnitTest`
