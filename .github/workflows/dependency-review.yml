name: Dependency Review

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review & Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'Suz41/Fishbowl'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Dependency Review Action
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
