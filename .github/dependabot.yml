version: 2
updates:
  # 1. GitHub Actions Dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # 2. Gradle Dependencies & Build Tooling
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "gradle"
    groups:
      gradle-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "*gradle*"
          - "gradle-wrapper"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Android Gradle Plugin (AGP) 8.13.2 requires Gradle <= 9.5.
      # Gradle 9.6.0+ removes the InternalProblems internal API, breaking AGP 8.13.x compilation.
      # Ignore automated Gradle wrapper updates >= 9.6.0 until AGP is upgraded to 8.14+ or 9.0.
      - dependency-name: "org.gradle:gradle"
        versions: [">= 9.6.0"]
      - dependency-name: "gradle"
        versions: [">= 9.6.0"]
      - dependency-name: "gradle-wrapper"
        versions: [">= 9.6.0"]
      # androidx.core 1.14.0+ requires compileSdk 37 and AGP 9.1+, while project is on AGP 8.13.2 / compileSdk 36
      - dependency-name: "androidx.core:core"
        versions: [">= 1.14.0"]
      - dependency-name: "androidx.core:core-ktx"
        versions: [">= 1.14.0"]
      # HiddenApiBypass 6.2+ requires compileSdk 37
      - dependency-name: "org.lsposed.hiddenapibypass:hiddenapibypass"
        versions: [">= 6.2.0"]
      # Material Components 1.13.0+ raises minSdkVersion from 21 to 23
      - dependency-name: "com.google.android.material:material"
        versions: [">= 1.13.0"]
