plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

ext {
    // The packageVariant defines the bootstrap variant that will be included in the app APK.
    // This must be supported by com.termux.shared.termux.TermuxBootstrap.PackageVariant or app will
    // crash at startup.
    // Bootstrap of a different variant must not be manually installed by the user after app installation
    // by replacing $PREFIX since app code is dependant on the variant used to build the APK.
    // Currently supported values are: [ "apt-android-7" "apt-android-5" ]
    packageVariant = System.getenv("TERMUX_PACKAGE_VARIANT") ?: "apt-android-7" // Default: "apt-android-7"
}

android {
    namespace "com.termux"

    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    kotlinOptions {
        jvmTarget = "1.8"
    }
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion
    def appVersionName = System.getenv("TERMUX_APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_APK_VERSION_TAG") ?: ""
    def splitAPKsForDebugBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS") ?: "1"
    def splitAPKsForReleaseBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS") ?: "0" // F-Droid does not support split APKs #1904

    dependencies {
        implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
        implementation "androidx.annotation:annotation:1.11.0"
        implementation "androidx.core:core:1.13.1"
        implementation "androidx.documentfile:documentfile:1.1.0"
        implementation "com.google.android.material:material:1.12.0"
        implementation "com.google.guava:guava:24.1-jre"
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"
        implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'

        implementation "org.apache.commons:commons-compress:1.28.0"
        implementation "org.tukaani:xz:1.12"
        implementation project(":termux-shared")
    }

    defaultConfig {
        applicationId "com.fishbowl.app"
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        versionCode 101418
        versionName "1.4.10-beta.2"

        if (project.hasProperty("appVersionCode")) {
            versionCode project.property("appVersionCode").toInteger()
        } else if (System.getenv("FISHBOWL_VERSION_CODE")) {
            versionCode System.getenv("FISHBOWL_VERSION_CODE").toInteger()
        }

        if (project.hasProperty("appVersionName")) {
            versionName project.property("appVersionName")
        } else if (System.getenv("FISHBOWL_VERSION_NAME")) {
            versionName System.getenv("FISHBOWL_VERSION_NAME")
        } else if (appVersionName) {
            versionName appVersionName
        }
        validateVersionName(versionName)

        buildConfigField "String", "TERMUX_PACKAGE_VARIANT", "\"" + project.ext.packageVariant + "\"" // Used by TermuxApplication class

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.fishbowl.app"
        manifestPlaceholders.TERMUX_APP_NAME = "Fishbowl"


        splits {
            abi {
                enable ((gradle.startParameter.taskNames.any { it.contains("Debug") } && splitAPKsForDebugBuilds == "1") ||
                    (gradle.startParameter.taskNames.any { it.contains("Release") } && splitAPKsForReleaseBuilds == "1"))
                reset ()
                include 'arm64-v8a'
                universalApk false
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }

        release {
            // Secure production keystore resolution:
            // Prioritizes environment variables (CI secrets) or project properties.
            // Refuses silent testkey fallback when running release tasks in CI.
            def isCi = (System.getenv("CI") == "true" || System.getenv("GITHUB_ACTIONS") == "true" || project.hasProperty("CI") || project.hasProperty("FISHBOWL_CI"))
            def isReleaseTask = gradle.startParameter.taskNames.any { it.contains("Release") }
            def releaseKeyStorePath = System.getenv("FISHBOWL_RELEASE_KEYSTORE_PATH") ?: (project.findProperty("FISHBOWL_RELEASE_KEYSTORE_PATH") ?: null)
            def isReleaseValidation = project.hasProperty("validateReleaseCompilation") ||
                                      project.hasProperty("FISHBOWL_VALIDATE_RELEASE") ||
                                      (System.getenv("GITHUB_WORKFLOW") == "Build Bot")
            if (releaseKeyStorePath && file(releaseKeyStorePath).exists()) {
                storeFile file(releaseKeyStorePath)
                keyAlias System.getenv("FISHBOWL_RELEASE_KEY_ALIAS") ?: (project.findProperty("FISHBOWL_RELEASE_KEY_ALIAS") ?: 'alias')
                storePassword System.getenv("FISHBOWL_RELEASE_STORE_PASSWORD") ?: (project.findProperty("FISHBOWL_RELEASE_STORE_PASSWORD") ?: '')
                keyPassword System.getenv("FISHBOWL_RELEASE_KEY_PASSWORD") ?: (project.findProperty("FISHBOWL_RELEASE_KEY_PASSWORD") ?: '')
            } else if (isCi && isReleaseTask && !isReleaseValidation) {
                throw new GradleException("FISHBOWL_RELEASE_KEYSTORE_PATH must be configured in CI for release builds! Refusing to sign production release APK with untrusted debug testkey.")
            } else {
                if (isCi && isReleaseTask) {
                    logger.warn("[SECURITY NOTICE] Release compilation validation build in CI: FISHBOWL_RELEASE_KEYSTORE_PATH not configured. Signing with untrusted testkey for compilation validation only. This artifact must NOT be published as a production release!")
                }
                storeFile file('testkey_untrusted.jks')
                keyAlias 'alias'
                storePassword 'xrj45yWGLbsO7W0v'
                keyPassword 'xrj45yWGLbsO7W0v'
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false // Reproducible builds
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }


    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'ProtectedPermissions'
        warningsAsErrors false
        checkAllWarnings false
        ignoreTestSources true
        htmlReport true
        xmlReport true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "debug") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("Fishbowl-v" + versionName + "-debug" + (abi ? "-" + abi : "-universal") + ".apk")
            } else if (variant.buildType.name == "release") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("Fishbowl-v" + versionName + "-release" + (abi ? "-" + abi : "-universal") + ".apk")
            }
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.17"
    testImplementation "org.json:json:20231013"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:\\.(0|[1-9]\\d*))?(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '"  + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}

// Termux native bootstrap archives retired in favor of embedded JellyfinBootstrapper.
task downloadBootstraps() {
    doLast {
        logger.info("Termux native bootstrap archives retired; runtime managed by JellyfinBootstrapper.")
    }
}

